layer:
  type: Board
  description: Board setup for AI/ML with Ethos U85
  for-board: ARM::SSE-320
  for-device: ARM::SSE-320-FVP

  connections:
    - connect: Corstone-320
      provides:
        - CMSIS_USART
        - CMSIS_VIO
        - CMSIS_VSTREAM_AUDIO_IN
        - CMSIS_VSTREAM_AUDIO_OUT
        - CMSIS_VSTREAM_VIDEO_IN
        - CMSIS_VSTREAM_VIDEO_OUT
        - STDIN
        - STDOUT
        - STDERR
        - Heap: 786432

  define:
    - CMSIS_target_header: \"Corstone-320.h\"
    - ETHOSU85
    - ARM_MODEL_USE_PMU_COUNTERS

  packs:
    - pack: ARM::CMSIS
    - pack: ARM::CMSIS-Compiler@^2.1.0
    - pack: ARM::ethos-u-core-driver@^1.26.2
    - pack: ARM::SSE_320_BSP@1.1.0

  components:
    - component: CMSIS:CORE

    - component: CMSIS Driver:USART
    - component: CMSIS Driver:VIO
    - component: CMSIS Driver:vStream:Custom

    - component: CMSIS-Compiler:CORE
    - component: CMSIS-Compiler:STDERR:Custom
    - component: CMSIS-Compiler:STDIN:Custom
    - component: CMSIS-Compiler:STDOUT:Custom

    - component: Device:Definition
    - component: Device:Startup&C Startup

    - component: Device:Native Driver:SysCounter
    - component: Device:Native Driver:SysTimer
    - component: Device:Native Driver:Timeout
    - component: Device:Native Driver:UART

    - component: Machine Learning:NPU Support:Ethos-U Driver&Generic U85

  groups:
    - group: Board
      files:
        - file: ./main.c
        - file: ./main.h
        - file: ./ethos_setup.c
        - file: ./retarget_stdio.c

    - group: vStream
      add-path:
        - ./RTE/CMSIS_Driver
      files:
        - file: ./vstream/include/arm_vsi.h
        - file: ./vstream/vstream_audio_in.c
        - file: ./vstream/vstream_audio_out.c
        - file: ./vstream/vstream_video_in.c
        - file: ./vstream/vstream_video_out.c
        - file: ./RTE/CMSIS_Driver/vstream_audio_in_config.h
        - file: ./RTE/CMSIS_Driver/vstream_audio_out_config.h
        - file: ./RTE/CMSIS_Driver/vstream_video_in_config.h
        - file: ./RTE/CMSIS_Driver/vstream_video_out_config.h

  linker:
    - regions: ./regions_SSE-320.h
